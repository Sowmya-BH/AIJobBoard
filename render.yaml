# App-ONLY Blueprint. The ResumeHQ/SBERT scorer lives on a Hugging Face Space,
# NOT here — so nothing in this deploy installs torch/resumehq/gradio.
#
# runtime: python  => Render installs ONLY root requirements.txt (light) and
# ignores every Dockerfile in the repo, including scorer_service/Dockerfile.
# The scorer_service/ and jobdata/ folders are just inert files in the repo.

services:
- type: web
  name: job-scout-app
  runtime: python                 # NOT docker -> can't build the scorer image
  plan: free                      # 512MB is enough; app is torch-free
  buildCommand: pip install -r requirements.txt
  startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT   # $PORT, not 8000
  healthCheckPath: /
  envVars:
  - key: APP_DB
    value: data/app_sample.db     # read-only jobs DB committed to the repo
  - key: DATABASE_URL
    fromDatabase: { name: jobscout-db, property: connectionString }
  - key: JWT_SECRET
    generateValue: true
  - key: APP_ENCRYPTION_KEY
    generateValue: true
  # --- scorer is remote (HF Gradio Space) ---
  - key: RQ_SCORER_KIND
    value: gradio
  - key: RQ_SCORER_URL
    sync: false                   # set to https://<user>-<space>.hf.space
  - key: RQ_CLOUD_ONLY
    value: "1"                    # HARD-block any local torch/resumehq import
  - key: GEMINI_API_KEY
    sync: false                   # optional fallback; users' BYO keys are primary

databases:
- name: jobscout-db
  plan: free