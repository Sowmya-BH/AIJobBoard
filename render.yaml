# App-only Blueprint. ONE external database: MongoDB Atlas (jobs + users).
# Nothing (no JSON, no SQLite) is shipped in the image, so cold starts are fast
# and the app stays well under 512MB. runtime: python => installs only
# requirements.txt and ignores any Dockerfile.

services:
- type: web
  name: job-scout-app
  runtime: python
  plan: free
  buildCommand: pip install -r requirements.txt
  startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
  healthCheckPath: /
  envVars:
  - key: MONGODB_URI            # mongodb+srv://... from Atlas (jobs + users)
    sync: false
  - key: MONGODB_DB
    value: jobscout
  - key: JWT_SECRET
    generateValue: true
  - key: APP_ENCRYPTION_KEY     # encrypts stored user API keys (Fernet)
    generateValue: true
  # --- scorer on Hugging Face (Gradio/ZeroGPU) ---
  - key: RQ_SCORER_KIND
    value: gradio
  - key: RQ_SCORER_URL
    sync: false
  # --- optional semantic search (Qdrant) + server Gemini ---
  - key: QDRANT_URL
    sync: false
  - key: QDRANT_API_KEY
    sync: false
  - key: HF_TOKEN                # HF Inference API token for resume embeddings
    sync: false
  - key: HF_EMBED_URL           # HF Inference endpoint (router URL; see notes)
    sync: false
  - key: GEMINI_API_KEY         # resume parsing, chat fallback, embeddings
    sync: false